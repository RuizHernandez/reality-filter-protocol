name: sync-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PROTOCOL.md / LINEAGE.md / README.md / adapters are in sync
        run: bash scripts/sync-check.sh
